    app.kubernetes.io/name: worker-port-videos
    app.kubernetes.io/part-of: recomphub
spec:
  schedule: "30 4 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: worker-port-videos
            app.kubernetes.io/part-of: recomphub
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: worker
              image: ghcr.io/cefege/recomphub.com
              command: ["/usr/local/app/worker", "port-videos"]
              envFrom:
                - secretRef:
                    name: recomphub-secrets
              env:
                - name: MEDIA_DIR
                  value: /data/media
                - name: RUST_LOG
                  value: info
                - name: YTDLP_COOKIES
                  value: /secrets/ytdlp/cookies.txt
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 1Gi
              securityContext:
                runAsNonRoot: true
                runAsUser: 65532
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: media
                  mountPath: /data/media
                - name: tmp
                  mountPath: /tmp
                - name: ytdlp-cookies
                  mountPath: /secrets/ytdlp
                  readOnly: true
          volumes:
            - name: media
              persistentVolumeClaim:
                claimName: media
            - name: tmp
              emptyDir: {}
            - name: ytdlp-cookies
              secret:
                secretName: recomphub-ytdlp-cookies
                optional: true
---
