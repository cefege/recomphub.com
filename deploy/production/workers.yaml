apiVersion: batch/v1
kind: CronJob
metadata:
  name: media-sync
  labels:
    app.kubernetes.io/name: worker-media-sync
    app.kubernetes.io/part-of: recomphub
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: worker-media-sync
            app.kubernetes.io/part-of: recomphub
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: worker
              image: ghcr.io/cefege/recomphub.com
              command: ["/usr/local/app/worker", "media-sync"]
              envFrom:
                - secretRef:
                    name: recomphub-secrets
              env:
                - name: MEDIA_DIR
                  value: /data/media
                - name: RUST_LOG
                  value: info
              resources:
                requests:
                  cpu: 1000m
                  memory: 128Mi
                limits:
                  memory: 1Gi
              securityContext:
                runAsNonRoot: true
                runAsUser: 65532
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: media
                  mountPath: /data/media
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: media
              persistentVolumeClaim:
                claimName: media
            - name: tmp
              emptyDir: {}
---
