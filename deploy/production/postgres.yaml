apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: recomphub
spec:
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: recomphub
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: recomphub
    spec:
      securityContext:
        fsGroup: 70
      # A clean shutdown checkpoints; an unclean one replays WAL on start.
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgres
          image: postgres:17-alpine
          env:
            - name: POSTGRES_USER
              value: recomphub
            - name: POSTGRES_DB
              value: recomphub
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: recomphub-secrets
                  key: POSTGRES_PASSWORD
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "recomphub", "-d", "recomphub"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "recomphub", "-d", "recomphub"]
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-backups
  labels:
    app.kubernetes.io/name: postgres-backup
    app.kubernetes.io/part-of: recomphub
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  labels:
    app.kubernetes.io/name: postgres-backup
    app.kubernetes.io/part-of: recomphub
spec:
  schedule: "17 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: postgres-backup
            app.kubernetes.io/part-of: recomphub
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 70
            runAsGroup: 70
            fsGroup: 70
          containers:
            - name: pg-dump
              image: postgres:17-alpine
              env:
                - name: PGHOST
                  value: postgres
                - name: PGUSER
                  value: recomphub
                - name: PGDATABASE
                  value: recomphub
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: recomphub-secrets
                      key: POSTGRES_PASSWORD
                - name: KEEP
                  value: "14"
              # A dump is published only once complete: a crash mid-dump leaves a
              # .partial that the next run's prune removes, never a short archive.
              # Restore: pg_restore --clean --if-exists -d recomphub <archive>.
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  stamp="$(date -u +%Y-%m-%dT%H-%M-%SZ)"
                  rm -f /backups/*.partial
                  pg_dump --format=custom --file="/backups/recomphub-${stamp}.dump.partial"
                  mv "/backups/recomphub-${stamp}.dump.partial" "/backups/recomphub-${stamp}.dump"
                  ls -1t /backups/recomphub-*.dump | tail -n "+$((KEEP + 1))" | xargs -r rm -f
                  ls -l /backups
              volumeMounts:
                - name: backups
                  mountPath: /backups
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: postgres-backups
