# Applied once by hand (kubectl apply -f). Flux does not sync this file.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: recomphub
  namespace: flux-system
spec:
  interval: 1m
  url: https://github.com/cefege/recomphub.com
  ref:
    branch: main
  ignore: |
    /*
    !/deploy/production/
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: recomphub-production
  namespace: flux-system
spec:
  interval: 5m
  timeout: 5m
  path: ./deploy/production
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: recomphub
