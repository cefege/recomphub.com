name: image

on:
  push:
    branches: [main]
    paths-ignore: ['deploy/**']
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: image-main
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push image
        run: |
          TAG="sha-${GITHUB_SHA::12}"
          IMAGE="ghcr.io/cefege/recomphub.com:${TAG}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE_TAG=${TAG}" >> "$GITHUB_ENV"

      # Re-apply the pin on top of the latest main instead of rebasing: an earlier run's pin
      # commit edits the same line and would conflict.
      - name: Commit and push pin
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            yq -i '(.images[] | select(.name == "ghcr.io/cefege/recomphub.com")).newTag = "'"$IMAGE_TAG"'"' deploy/production/kustomization.yaml
            git add deploy/production/kustomization.yaml
            git commit -m "deploy: recomphub ${IMAGE_TAG} [skip ci]"
            git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
