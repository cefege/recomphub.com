name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/recomphub_test

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: recomphub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install native AVIF build prerequisites
        run: sudo apt-get update && sudo apt-get install -y build-essential git meson nasm ninja-build pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Enable the bundled dav1d build
        run: echo "SYSTEM_DEPS_DAV1D_BUILD_INTERNAL=always" >> "$GITHUB_ENV"

      - name: Test
        run: cargo test --workspace --features recomphub/server

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --features recomphub/server -- -D warnings

      - name: Check browser target
        run: cargo check -p recomphub --no-default-features --features web --target wasm32-unknown-unknown

  browser-library:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: recomphub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Create isolated browser database
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -c 'CREATE DATABASE recomphub_browser_test'

      - name: Build production image without publishing
        run: docker build --tag recomphub-browser-ci .

      - name: Start isolated website container
        run: >-
          docker run --detach --rm --name recomphub-browser-ci --network host
          --env DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5432/recomphub_browser_test
          --env SITE_URL=http://127.0.0.1:8080
          --env MEDIA_DIR=/tmp/recomphub-media
          recomphub-browser-ci

      - name: Install browser test dependencies
        run: |
          python3 -m pip install --disable-pip-version-check 'psycopg[binary]' playwright
          python3 -m playwright install --with-deps chromium

      - name: Exercise private library in a real browser
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/recomphub_browser_test
          RECOMPHUB_BROWSER_BASE: http://127.0.0.1:8080
        run: |
          mkdir -p artifacts
          python3 crates/web/tests/browser/library_smoke.py

      - name: Upload browser artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-library
          path: artifacts
          if-no-files-found: warn

      - name: Stop isolated website container
        if: always()
        run: docker stop recomphub-browser-ci || true
  native-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            package_types: macos
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            package_types: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install verified Dioxus CLI 0.7.10 binary
        run: python .github/install_desktop_cli.py ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Check desktop dependency boundary
        shell: bash
        run: |
          tree="$(cargo tree -p recomphub --no-default-features --features desktop -e normal)"
          case "$tree" in
            *recomphub-db*|*recomphub-ingest*|*sqlx*|*dioxus-server*)
              echo "Desktop dependency tree includes a server-only dependency."
              exit 1
              ;;
          esac

      - name: Test native engine lifecycle
        run: cargo test -p recomphub-desktop

      - name: Test desktop authentication state
        run: cargo test -p recomphub --no-default-features --features desktop --lib

      - name: Bundle development debug desktop artifacts
        run: dx bundle --desktop --target ${{ matrix.target }} --features desktop --no-default-features --package recomphub --fullstack false --codesign false --package-types ${{ matrix.package_types }} --out-dir target/desktop-artifacts/debug

      - name: Bundle development release desktop artifacts
        run: dx bundle --desktop --target ${{ matrix.target }} --features desktop --no-default-features --release --package recomphub --fullstack false --codesign false --package-types ${{ matrix.package_types }} --out-dir target/desktop-artifacts/release

      - name: Verify macOS app bundle signatures
        if: runner.os == 'macOS'
        run: |
          codesign --verify --deep --strict --verbose=2 target/desktop-artifacts/debug/RecompHub.app
          codesign --verify --deep --strict --verbose=2 target/desktop-artifacts/release/RecompHub.app

      - name: Package and mount-verify Apple Silicon disk images
        if: runner.os == 'macOS'
        run: |
          python .github/package_macos_dmg.py target/desktop-artifacts/debug/RecompHub.app target/desktop-artifacts/debug
          python .github/package_macos_dmg.py target/desktop-artifacts/release/RecompHub.app target/desktop-artifacts/release

      - name: Install and open the signed-out Windows library
        if: runner.os == 'Windows'
        timeout-minutes: 5
        shell: pwsh
        run: ./crates/web/tests/desktop_windows_smoke.ps1

      - name: Upload development test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}-test
          path: target/desktop-artifacts
          if-no-files-found: warn
