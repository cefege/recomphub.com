[package]
name = "recomphub-ingest"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
recomphub-shared = { path = "../shared" }
recomphub-db = { path = "../db" }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "json", "macros"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
chrono = { version = "0.4", default-features = false, features = ["std", "serde", "clock"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "avif", "avif-native"] }
flate2 = "1"
tar = "0.4"
scraper = "0.23"
feed-rs = "2"
sha2 = "0.10"
base64 = "0.22"
rand = "0.9"
xxhash-rust = { version = "0.8", features = ["xxh64"] }
regex = "1"
tracing = "0.1"
thiserror = "2"
anyhow = "1"
