[package]
name = "recomphub-db"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
recomphub-shared = { path = "../shared" }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "migrate", "chrono", "json", "macros"] }
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", default-features = false, features = ["std", "serde", "clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rand = "0.9"
thiserror = "2"
tracing = "0.1"
